<style>
:root{--bg:#F5F7FB;--card:#fff;--ink:#1c2434;--mut:#6b7587;--line:#E6EAF2;--ac:#5468E7;--acs:#EEF0FD;--r:16px}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:rgba(245,247,251,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:880px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em;margin-right:auto}
.brand svg{width:36px;height:36px}
#q{width:220px;max-width:100%;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:#fff}
.b{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.b:hover{border-color:var(--ac);background:var(--acs)}
.b.p{background:var(--ac);border-color:var(--ac);color:#fff}
.b.p:hover{background:#4256d6}
.b.d{color:#c0392b}
.ib{border:0;background:transparent;border-radius:10px;width:34px;height:34px;display:inline-grid;place-items:center;color:var(--mut)}
.ib:hover{background:var(--acs);color:var(--ac)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{max-width:880px;margin:0 auto;padding:22px 20px 80px}
section{margin-bottom:34px}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.st{flex:1;min-width:0;border:0;background:transparent;font-size:19px;font-weight:700;letter-spacing:-.01em;padding:6px 8px;border-radius:8px}
.st:hover,.st:focus{background:#fff}
.n{color:var(--mut);font-size:13px}
.it{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;transition:border-color .15s}
.it:hover{border-color:#cdd5ea}
.row{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px}
.ic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,#5468E7) 12%,#fff);color:var(--c,#5468E7)}
.ic svg{width:21px;height:21px}
.ic svg.br{fill:currentColor;stroke:none}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac{display:flex;align-items:center;gap:2px;flex:none}
.cp{margin-left:6px}
.chev{transition:transform .2s}
.chev.o{transform:rotate(180deg)}
.vs{border-top:1px solid var(--line);padding:6px 14px 12px}
.v{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.v:last-child{border:0}
.vt{flex:1;white-space:pre-wrap;word-break:break-word;user-select:text;font-size:14px;line-height:1.55}
.vb{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.vb div{display:flex}
.tag{font-size:12px;color:var(--ac);background:var(--acs);border-radius:999px;padding:1px 9px;margin-bottom:2px}
.up{transform:rotate(180deg)}
.empty{text-align:center;color:var(--mut);padding:50px 0}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s}
#toast.s{opacity:1;transform:translate(-50%,0)}
dialog{border:0;border-radius:20px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(28,36,52,.25);color:var(--ink)}
dialog::backdrop{background:rgba(28,36,52,.35)}
.dl{padding:22px;display:grid;gap:14px;max-height:88vh;overflow:auto}
.dl h2{margin:0;font-size:18px}
label{display:grid;gap:5px;font-size:13px;color:var(--mut);font-weight:600}
label input,label select,label textarea{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:400;color:var(--ink);background:#fff;width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.vr{display:grid;gap:6px}
.vr .l{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);font-weight:600}
.da{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.da .b.d{margin-right:auto}
@media(max-width:560px){.tx small{display:none}.it .ac .ib.hide{display:none}#q{width:100%;order:3}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

 if(isL)h+=`<button class="ib" data-act="go" title="Abrir link">${ico('ext')}</button>`;
 h+=`<button class="ib" data-act="edit" title="Editar">${ico('edit')}</button><button class="b p cp" data-act="cp">${ico('copy')}Copiar</button></div></div>`;
 if(!isL&&o)h+=`<div class="vs">`+it.variants.map((v,k)=>`<div class="v" data-v="${k}"><div class="vt">${esc(v)}</div><div class="vb">${k?'':'<span class="tag">Principal</span>'}<div>${k?`<button class="ib" data-act="up" title="Subir">${ico('chev','up')}</button>`:''}${k<nv-1?`<button class="ib" data-act="dn" title="Descer">${ico('chev')}</button>`:''}<button class="ib" data-act="cpv" title="Copiar esta variação">${ico('copy')}</button></div></div></div>`).join('')+`</div>`;
 return h+'</div>'}
function render(){
 const f=q.trim().toLowerCase();
 const m=it=>!f||(it.title+' '+(it.url||'')+' '+(it.variants||[]).join(' ')).toLowerCase().includes(f);
 const h=D.map((s,n)=>{const its=s.items.filter(m);if(f&&!its.length)return'';
  return `<section data-s="${s.id}"><div class="sh"><input class="st" value="${esc(s.title)}" data-act="stitle" aria-label="Nome da seção"><span class="n">${s.items.length}</span><button class="b" data-act="add">${ico('chev','').replace('M6 9l6 6 6-6','M12 5v14M5 12h14')}Adicionar</button>${n?`<button class="ib" data-act="sup" title="Mover seção para cima">${ico('chev','up')}</button>`:''}${n<D.length-1?`<button class="ib" data-act="sdn" title="Mover seção para baixo">${ico('chev')}</button>`:''}<button class="ib" data-act="dsec" title="Excluir seção">${ico('trash')}</button></div>${its.map(i=>item(s,i)).join('')||'<div class="empty">Nenhum item ainda.</div>'}</section>`}).join('');
 $('#app').innerHTML=h||'<div class="empty">Nada encontrado. Use “Seção” para criar uma nova seção.</div>'}
async function cp(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Copiado!')}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('s');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('s'),1400)}
const find=(sid,iid)=>{const s=D.find(x=>x.id===sid);return[s,s&&s.items.find(i=>i.id===iid)]};
function drawV(){const w=$('#fv');w.innerHTML=ed.item.variants.map((v,k)=>`<div class="vr"><div class="l"><span>${k?'Variação '+(k+1):'Texto principal'}</span>${ed.item.variants.length>1?`<button class="ib" data-d="rv" data-k="${k}" title="Remover">${ico('trash')}</button>`:''}</div><textarea class="fvv">${esc(v)}</textarea></div>`).join('')+`<button class="b" data-d="av" type="button">Adicionar variação</button>`}
function readV(){ed.item.variants=[...document.querySelectorAll('.fvv')].map(t=>t.value)}
function kindUI(){const l=$('#ft').value==='link';$('#fu').hidden=!l;$('#fv').hidden=l;if(!l&&!(ed.item.variants||[]).length){ed.item.variants=[''];}if(!l)drawV()}
function openEd(sid,iid){
 const [s,it]=find(sid,iid);
 ed={sid,isNew:!it,item:it?JSON.parse(JSON.stringify(it)):{id:uid(),type:'link',title:'',url:'',variants:['']}};
 $('#dlb').innerHTML=`<h2>${ed.isNew?'Novo item':'Editar item'}</h2><label>Tipo<select id="ft"><option value="link">Link</option><option value="descricao">Descrição</option><option value="texto">Texto</option></select></label><label>Título<input id="fti" value="${esc(ed.item.title)}"></label><label id="fu">Link<input id="fur" type="url" placeholder="https://" value="${esc(ed.item.url||'')}"></label><div id="fv" style="display:grid;gap:14px"></div><div class="da">${ed.isNew?'':'<button class="b d" data-d="del">Excluir</button>'}<button class="b" data-d="x">Cancelar</button><button class="b p" data-d="ok">Salvar</button></div>`;
 $('#ft').value=ed.item.type;kindUI();$('#dlg').showModal();$('#fti').focus()}
function saveEd(){
 const t=$('#fti').value.trim(),type=$('#ft').value,it=ed.item;
 if(!t){$('#fti').focus();return}
 it.title=t;it.type=type;
 if(type==='link'){let u=$('#fur').value.trim();if(!u){$('#fur').focus();return}if(!/^[a-z]+:/i.test(u))u='https://'+u;it.url=u;delete it.variants}
 else{readV();it.variants=it.variants.filter(v=>v.trim());if(!it.variants.length){document.querySelector('.fvv').focus();return}delete it.url}
 const s=D.find(x=>x.id===ed.sid),k=s.items.findIndex(i=>i.id===it.id);
 k<0?s.items.push(it):s.items[k]=it;
 save();render();$('#dlg').close()}
document.addEventListener('click',e=>{
 const d=e.target.closest('[data-d]');
 if(d){const a=d.dataset.d;
  if(a==='x')$('#dlg').close();
  else if(a==='ok')saveEd();
  else if(a==='av'){readV();ed.item.variants.push('');drawV();[...document.querySelectorAll('.fvv')].pop().focus()}
  else if(a==='rv'){readV();ed.item.variants.splice(+d.dataset.k,1);drawV()}
  else if(a==='del'&&confirm('Excluir este item?')){const s=D.find(x=>x.id===ed.sid);s.items=s.items.filter(i=>i.id!==ed.item.id);save();render();$('#dlg').close()}
  return}
 const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;
 const a=b.dataset.act,sid=b.closest('[data-s]')?.dataset.s,iid=b.closest('[data-i]')?.dataset.i,vk=+b.closest('[data-v]')?.dataset.v;
 const [s,it]=find(sid,iid);
 if(a==='cp')cp(it.type==='link'?it.url:it.variants[0]);
 else if(a==='cpv')cp(it.variants[vk]);
 else if(a==='go')window.open(it.url,'_blank','noopener');
 else if(a==='tog'){open.has(iid)?open.delete(iid):open.add(iid);render()}
 else if(a==='edit')openEd(sid,iid);
 else if(a==='add')openEd(sid,null);
 else if(a==='up'||a==='dn'){const j=a==='up'?vk-1:vk+1,v=it.variants;[v[vk],v[j]]=[v[j],v[vk]];save();render()}
 else if(a==='sup'||a==='sdn'){const n=D.findIndex(x=>x.id===sid),j=a==='sup'?n-1:n+1;if(j>=0&&j<D.length){[D[n],D[j]]=[D[j],D[n]];save();render();document.querySelector(`section[data-s="${sid}"]`)?.scrollIntoView({block:'nearest',behavior:'smooth'})}}
 else if(a==='dsec'){if(confirm('Excluir a seção “'+s.title+'” e todos os itens dela?')){D=D.filter(x=>x.id!==sid);save();render()}}
 else if(a==='nsec'){D.push({id:uid(),title:'Nova seção',items:[]});save();render();const i=[...document.querySelectorAll('.st')].pop();i.focus();i.select();i.scrollIntoView({block:'center'})}
 else if(a==='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));l.download='central-controle-adi.json';l.click()}
 else if(a==='imp')$('#file').click()});
document.addEventListener('change',e=>{
 if(e.target.id==='ft'){if($('#ft').value!=='link'&&!ed.item.variants?.length)ed.item.variants=[''];kindUI()}
 else if(e.target.dataset.act==='stitle'){const s=D.find(x=>x.id===e.target.closest('[data-s]').dataset.s);s.title=e.target.value.trim()||'Sem título';save()}
 else if(e.target.id==='file'){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j))throw 0;if(confirm('Substituir os dados atuais pelos do arquivo?')){D=j;save();render();toast('Importado!')}}catch(x){alert('Arquivo inválido.')}};r.readAsText(e.target.files[0]);e.target.value=''}});
$('#q').addEventListener('input',e=>{q=e.target.value;render()});
render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
